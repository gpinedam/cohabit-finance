name: CI / Deploy to Azure

# Triggers:
#   - pull_request → develop : runs the CI job (build check)
#   - push         → develop : runs CI + deploy (happens when a PR is merged)
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: CI — Build Check
  # Runs on every opened / updated PR toward develop.
  # Verifies that the frontend compiles and the backend has no syntax errors.
  # ──────────────────────────────────────────────────────────────────────────
  ci:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Frontend ──────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        # Compiles React + Tailwind → backend/frontend/dist/
        # Fails if there are broken imports, invalid JSX, etc.
        run: npm run build
        working-directory: frontend

      # ── Backend ───────────────────────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt --quiet

      - name: Check Python syntax
        # py_compile detects SyntaxErrors across all .py files.
        # Replace with `pytest` once tests are added.
        run: |
          find backend/app -name "*.py" | xargs python -m py_compile
          echo "✅ Backend syntax OK"

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Deploy
  # Runs only on push to develop (i.e. after a PR is merged).
  # Requires the ci job to have passed first.
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Build frontend ────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        # Output lands in backend/frontend/dist/ — served as static files by FastAPI
        run: npm run build
        working-directory: frontend

      # ── Azure authentication ───────────────────────────────────────────────
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── Sync secrets → Azure App Settings ─────────────────────────────────
      - name: Sync app settings to Azure
        # GitHub Secrets is the source of truth for these values.
        # Syncing on every deploy keeps Azure always aligned.
        run: |
          az webapp config appsettings set \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --settings \
              SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              ENVIRONMENT="${{ secrets.ENVIRONMENT }}" \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              ENABLE_ORYX_BUILD=false \
              WEBSITES_ENABLE_APP_SERVICE_STORAGE=true

      # ── Package & deploy ───────────────────────────────────────────────────
      - name: Create deployment zip
        # Mirrors the exclusions in deploy.sh:
        #   .venv/        — local macOS binaries, incompatible with Azure Linux
        #   data/         — local SQLite + uploads, never goes to production
        #   __pycache__/  — compiled bytecode, regenerated on startup
        #   .env          — secrets, injected via App Settings instead
        run: |
          cd backend
          zip -r /tmp/deploy.zip . \
            --exclude "*.pyc" \
            --exclude "*/__pycache__/*" \
            --exclude "*/.venv/*" \
            --exclude "*/data/*" \
            --exclude ".env"

      - name: Deploy zip to Azure App Service
        # --type zip triggers Azure's zip deploy (no Oryx build, no pip install by Azure)
        # startup.sh handles pip install inside the container.
        run: |
          az webapp deploy \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --src-path /tmp/deploy.zip \
            --type zip

      # ── Confirm ────────────────────────────────────────────────────────────
      - name: Print deployed URL
        run: |
          URL=$(az webapp show \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --query defaultHostName -o tsv)
          echo "✅ Deployed to https://$URL"
